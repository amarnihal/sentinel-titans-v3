<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form
      name="newsletter"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="newsletter" />
      <input
        type="hidden"
        name="subject"
        value="Newsletter signup — %{siteName} (%{submissionId})"
      />
      <input type="hidden" name="bot-field" value="" />
      <input name="email" type="email" />
    </form>

    <form
      name="catalogue"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="catalogue" />
      <input
        type="hidden"
        name="subject"
        value="Catalogue request — %{siteName} (%{submissionId})"
      />
      <input type="hidden" name="bot-field" value="" />
      <input name="email" type="email" />
    </form>

    <form
      name="vehicles-contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="vehicles-contact" />
      <input
        type="hidden"
        name="subject"
        value="Vehicles page contact — %{siteName} (%{submissionId})"
      />
      <input type="hidden" name="bot-field" value="" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="destination" type="text" />
      <input name="looking_for" type="text" />
      <textarea name="details"></textarea>
    </form>
  </body>
</html>
